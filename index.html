const prompts=[{ask:"Tell me about Leo’s morning. Start with ‘He …’.",hint:'说一说Leo的早晨，用He开头描述一个习惯。',example:'He goes to school every day.',wrong:'He go to school every day.'},{ask:"What does Mia do after school? Start with ‘She …’.",hint:'说一说Mia放学后做什么，用She开头。',example:'She reads a book after school.',wrong:'She read a book after school.'},{ask:"Describe one daily habit. Use ‘he’ or ‘she’.",hint:'换一个日常习惯，自己组织一句话。',example:'He plays football after school.',wrong:'He play football after school.'}];
const verbPairs={go:'goes',do:'does',have:'has',watch:'watches',study:'studies',read:'reads',play:'plays',eat:'eats',get:'gets',like:'likes',walk:'walks',brush:'brushes',drink:'drinks',wash:'washes',sleep:'sleeps',run:'runs',sing:'sings',cook:'cooks',work:'works'};
function analyze(raw){const text=String(raw||'').trim().replace(/\s+/g,' ');const current=prompts[Math.min(state.practice.round,2)];const support=(subtype,feedback)=>({kind:'classroom',subtype,feedback});if(/^(hello|hi|hey|good morning|good afternoon|good evening)\b/i.test(text))return support('greeting','Hi! I can help with our daily-routine practice.\n'+current.ask);if(/^(thanks|thank you)\b|^谢谢/i.test(text))return support('thanks',"You're welcome. Let's return to our task.\n"+current.ask);if(/\bwhy\b.*\b(goes|s|third|he|she)\b|为什么.*(s|goes|加|变)|为啥.*(s|加)|第三人称.*(为什么|怎么)/i.test(text))return support('explanation','We say “he goes” because he is one person. In the simple present, he / she / it usually takes a verb ending in -s or -es.\n描述日常习惯时，he / she / it 后的动词通常要变化：go → goes，read → reads，study → studies。这只说明目标规则，不代表所有时态都这样。\n再试一次：'+current.example);if(/^(help|hint|i don.t know|i do not know|how do i|不会|不懂|提示|帮我)/i.test(text))return support('help','Try this frame: He / She + a daily action + more information.\n可以借助支架：He / She + 动词变化 + 其他信息。示例：'+current.example+'\n请自己输入一句；查看提示不算答对。');if(/^(bye|goodbye|see you)\b|^再见|^暂停|^不练了/i.test(text))return support('pause','We can pause here. You can continue this task when you are ready.\n可以先暂停，本机文字会保留；也可以用顶部重置清除。不需要为了打卡继续。');if(!text)return{kind:'empty',feedback:'先写一句英语吧。可以从 He 或 She 开始。'};if(text.length>250)return{kind:'off_topic',feedback:'这次练习只需要一句短句，请控制在250个字符以内。'};const m=text.match(/^(he|she|it|leo|mia)\s+([a-z']+)\b/i);if(!m)return{kind:'off_topic',feedback:'这次只练习一般现在时的第三人称单数。请用 He / She + 一个日常动作重新说一句。例：She reads a book.'};const v=m[2].toLowerCase();if(verbPairs[v]){const start=m[1].length+1;const corrected=text.slice(0,start)+verbPairs[v]+text.slice(start+m[2].length);return{kind:'needs_fix',verb:v,corrected,feedback:`意思表达出来了。${m[1]} 后面的 ${v} 在这个日常习惯句中要变成 ${verbPairs[v]}。\n试着改写：${corrected}\n请你自己再输入一次。`}}if(Object.values(verbPairs).includes(v)&&text.slice(m[0].length).trim().length>1)return{kind:'correct',feedback:'这句使用了目标结构：第三人称单数 + 动词变化。这个规则检查通过了。'};return{kind:'off_topic',feedback:'我暂时只能检查日常习惯句中的这些动作：go、read、play、eat、get、watch、study、have等。请换一个动作；这不是对你英语能力的评分。'}}

function submitAnswer(raw){if(!state.practice.started||!state.practiceConsent){tell('请学习授权待家长确认并开始练习。');return{kind:'blocked'}}const result=analyze(raw);if(state.practice.completed&&result.kind!=='classroom'){tell('本次3轮练习已完成，请提交教师复核。');return{kind:'completed'}}if(result.kind==='empty'){tell(result.feedback);return result}const text=String(raw).trim().slice(0,250);state.practice.draft='';state.practice.messages.push({role:'user',text});if(result.kind==='classroom'){state.practice.interactions=state.practice.interactions||[];state.practice.interactions.push({type:result.subtype,text,at:new Date().toISOString()});state.practice.messages.push({role:'mia',text:result.feedback});commit();requestAnimationFrame(()=>{const c=$('#chatlog');if(c)c.scrollTop=c.scrollHeight;$('#answerInput')?.focus()});return result}state.practice.attempts.push({round:state.practice.round+1,text,kind:result.kind,corrected:result.corrected||null,at:new Date().toISOString()});if(result.kind==='correct'){state.practice.passed.push(state.practice.round);state.practice.round++;if(state.practice.round>=3){state.practice.completed=true;event('practice_complete');state.practice.messages.push({role:'mia',kind:'correct',text:'你已完成本次3轮目标结构练习。这里没有生成发音分数，也不代表能力等级提升。\n下一步：请真人教师复核本次文本练习记录。'})}else{const p=prompts[state.practice.round];state.practice.messages.push({role:'mia',kind:'correct',text:result.feedback+'\n\n'+p.ask+'\n'+p.hint})}}else{state.practice.messages.push({role:'mia',kind:result.kind,text:result.feedback})}commit();requestAnimationFrame(()=>{const c=$('#chatlog');if(c)c.scrollTop=c.scrollHeight;$('#answerInput')?.focus()});return result}

function generatePlan(){const x=state.personal;if(!x.diagnosisImported||!x.foundationEvidenceReady){tell('请先载入既有诊断，并查看模拟阶段任务证据。');return false}if(x.plan)x.history.push({version:x.plan.version,need:x.plan.preferences.need,goal:x.plan.preferences.goal,status:x.plan.status});const version=(x.plan?.version||0)+1;x.plan={version,status:'pending',preferences:structuredClone(x.preferences),lessons:makeLessons(x.preferences),at:new Date().toISOString()};x.reviewed=false;event('plan_generated','PLAN-'+version,'8节示例组合；规则驱动重组既有资源类别；不是官方课表');commit();tell('已生成8节可调整组合，等待教师确认。');return true}
function confirmPlan(){const p=state.personal.plan;if(!p||p.status!=='pending'){tell('请先生成待确认的课程组合。');return false}p.status='confirmed';p.confirmedAt=new Date().toISOString();event('plan_confirmed','PLAN-'+p.version,'模拟教师确认；正式教材、课包权益与排课待企业确认');commit();return true}
function returnPlan(){const p=state.personal.plan;if(!p||p.status!=='pending')return false;p.status='returned';p.reason='教师建议重新核对主目标、频次和现有权益。';event('plan_returned','PLAN-'+p.version,p.reason);commit();return true}
function simulatePlanReview(){const p=state.personal.plan;if(!p||p.status!=='confirmed'){tell('课程组合须先经教师确认。');return false}state.personal.reviewed=true;event('plan_stage_review','PLAN-'+p.version,'载入示例阶段复核证据；不代表8节已经实际授课或达到等级');commit();return true}
function nextStage(need){if(!state.personal.reviewed||!needNames[need]){tell('请先查看模拟阶段复核证据。');return false}updatePreferences({need});generatePlan();return true}
function routeToMia(){const p=state.personal.plan;if(!p||p.status!=='confirmed'||!p.lessons.some(l=>l.mia)){tell('本次组合须经教师确认，且包含已实现的第三人称作息任务。');return false}state.personal.pendingMia=true;if(!state.practiceConsent){state.learnerView='guardian';navigate('parent');tell('课程目标已选好；请家长单独确认练习授权后开始。');return false}return startPractice()}
function evidenceCards(stage=false){if(!stage)return `<div class="evidence-grid"><div class="evidence-tile"><b>口语表达</b><span class="chip amber">提示后完成（模拟）</span><p>固定入学样例任务：描述一个人物的日常作息。借助句子骨架完成，尚需换情境复查。</p></div><div class="evidence-tile"><b>语法运用</b><span class="chip amber">待教师复核（模拟）</span><p>固定入学样例任务：将第三人称单数用于完整句子。与正式MG级别或考试等级分开。</p></div><div class="evidence-tile"><b>听力理解</b><span class="chip amber">独立完成（模拟）</span><p>固定入学样例任务：听懂两步日常指令并回应。单次任务不能推导长期听力等级。</p></div></div>`;const q=state.personal.plan?.preferences||state.personal.preferences;const goal=goalOptions[q.need].find(g=>g[0]===q.goal)?.[1]||'当前目标任务';const tasks={speaking:q.need==='speaking'?goal:q.need==='listening'?'对所听材料回应或复述一个关键信息':'用当前目标结构描述熟悉情境',grammar:q.need==='grammar'?goal:q.goal==='daily_routine'?'在人物作息句中使用第三人称单数':'用完整句回应当前任务，结构由教师核对',listening:q.need==='listening'?goal:q.goal==='dialogue'?'听懂搭档的一问并作相关回应':'听目标情境示例，指出人物与行动'};const active=new Set([q.need,...q.cross]);const outcomes={speaking:'独立完成（模拟）',grammar:'提示后完成（模拟）',listening:'待进一步复核（模拟）'};return `<div class="evidence-grid">${Object.entries(needNames).filter(([key])=>key!=='writing').map(([key,name])=>`<div class="evidence-tile"><b>${name}</b><span class="chip amber">${active.has(key)?outcomes[key]:'本阶段未观察（模拟）'}</span><p>任务：${esc(tasks[key])}。${active.has(key)?'这是当前组合V'+state.personal.plan.version+'的示例复核样例，不代表实际授课结果。':'本阶段未配置此交叉维度，不据此推导进步。'}</p></div>`).join('')}</div>`}
function custom(){const x=state.personal,q=x.preferences,p=x.plan;const status={pending:'待教师确认',confirmed:'教师已确认',returned:'已退回调整',draft:'偏好已修改 · 请重新生成'};return header('我的课程，按目标组合。','已有诊断起步，跳过已会内容；用阶段证据调整口语、听力、语法与写作的下一步。','私人路径 · 全部诊断/排课状态均为体验')+`<section class="hero"><div><div class="overline">ONE LEARNER · AN ADAPTABLE PATH</div><h2>按目标安排每一节，<br>按证据调整下一步。</h2><p>复用企业MG、ME生活口语、分级阅读与主题课程池。先确认学习目标，再由教师把关组合与节奏。</p></div><div class="actions"><button class="button white" data-action="import-diagnosis">${x.diagnosisImported?'已载入示例入学诊断':'载入已有入学诊断（模拟）'} ${icon('arrow')}</button></div></section><div class="notice neutral">路径目标用可观察任务表达。MG T级仅作为企业课程框架参考，当前未定级，不映射外部等级；10节不是保证达标或必须购买的课包。页面课程标题为方案示例，非官方课文或已完成排课。</div><div class="grid cols-even section-gap"><section class="panel"><div class="panel-title"><h3>01 · 可调整的10节基础路径</h3><span class="chip line">可跳过 · 不强制购10节</span></div>${x.diagnosisImported?`<p class="small muted">已载入一份示例既有诊断：完整表达需提示，部分结构待复核。建议先观察这些任务；已掌握项可以跳过，课次与顺序由教师确认。</p><div class="table-wrap section-gap"><table><thead><tr><th>序号与示例目标</th><th>状态</th></tr></thead><tbody>${foundation.map((r,i)=>`<tr><td style="white-space:normal"><b>${String(i+1).padStart(2,'0')} ${r[0]}</b><br><span class="muted">${r[1]} · ${r[2]}</span></td><td><button class="button tiny outline" data-action="skip-foundation" data-index="${i}">${x.skipped.includes(i)?'已跳过 · 恢复':'标为已掌握并跳过'}</button></td></tr>`).join('')}</tbody></table></div><p class="footnote">当前跳过${x.skipped.length}项，建议观察${10-x.skipped.length}项。跳过只是体验选择，不能替代教师判断；不对应扣课或购买。</p><button class="button primary section-gap" data-action="foundation-evidence">${x.foundationEvidenceReady?'重新查看示例阶段证据':'模拟完成阶段任务，查看证据'}</button>`:`<div class="empty">先载入已有诊断的示例样例，再看10节建议与可跳过项。</div>`}</section><section class="panel"><div class="panel-title"><h3>02 · 看任务证据，再选方向</h3><span class="chip amber">示例阶段记录 · 非实际测评</span></div>${x.foundationEvidenceReady?evidenceCards():`<div class="empty">模拟阶段任务后展示口语、语法、听力和写作的不同证据状态；不会生成综合分或假发音分。</div>`}<div class="divider"></div><h3>组合偏好</h3><div class="preference-grid section-gap"><label>主要需求<select id="prefNeed">${Object.entries(needNames).map(([v,t])=>`<option value="${v}" ${q.need===v?'selected':''}>${t}</option>`).join('')}</select></label><label>具体任务目标<select id="prefGoal">${goalOptions[q.need].map(([v,t])=>`<option value="${v}" ${q.goal===v?'selected':''}>${t}</option>`).join('')}</select></label><label>月预算偏好（元）<input id="prefBudget" type="number" value="${q.budget}" min="0" max="10000" step="50"></label><label>每周建议真人课次<select id="prefWeekly">${[1,2,3,4].map(v=>`<option value="${v}" ${q.weekly===v?'selected':''}>${v} 节 / 周</option>`).join('')}</select></label></div><p class="small muted section-gap">希望加入的交叉训练</p><div class="actions">${[['speaking','口语'],['listening','听力'],['grammar','语法'],['writing','写作'],['reading','分级阅读']].map(([v,t])=>`<label class="checkline"><input type="checkbox" id="cross-${v}" data-cross="${v}" ${q.cross.includes(v)?'checked':''}>${t}</label>`).join('')}</div><div class="notice neutral section-gap">预算是家长偏好，不是报价。沿用现有课包扣课规则；未知实际课价不估算，最终课程、权益和额外教研费用由教师与企业确认。49元/月成长服务独立，不自动加入定制课价。</div><button class="button primary section-gap" data-action="generate-plan" ${!x.foundationEvidenceReady?'disabled':''}>${p?'按当前偏好重新生成8节组合':'生成后续8节示例组合'} ${icon('arrow')}</button></section></div>${p?`<section class="panel section-gap"><div class="panel-title"><div><h3>03 · 我的8节课程组合 · V${p.version}</h3><p class="help">主需求：${needNames[p.preferences.need]} · 每周${p.preferences.weekly}节，约${Math.ceil(8/p.preferences.weekly)}周 · 月预算偏好¥${p.preferences.budget}（非课价）</p></div><span class="chip ${p.status==='confirmed'?'':'amber'}">${status[p.status]}</span></div><p class="small muted">规则驱动重组已有资源类别；不是自动生成正式教材。每节由真人教师决定材料与讲授，数字老师只补充已确认目标内的短练习。</p><div class="lesson-grid section-gap">${p.lessons.map((l,i)=>`<article class="plan-lesson"><div class="plan-number">${String(i+1).padStart(2,'0')}</div><h4>${esc(l.title)}</h4><span class="chip line">${esc(l.resource)}</span><p><b>目标：</b>${esc(l.goal)}</p><p><b>为什么推荐：</b>${esc(l.why)}</p><p><b>分工：</b>真人选材、讲授与复核；${l.writing?'写作工坊支持起草、规则检查和修订，教师复核为角色体验。':l.mia?'Mia承接这一项已实现的规则练习。':'数字老师的后续任务需教研配置，本体验版未实现本节完整教学。'}</p><p><b>检验任务：</b>${esc(l.check)}</p>${l.writing?`<button class="button tiny primary" data-writing="route" ${p.status!=='confirmed'?'disabled':''}>开始本节写作试练</button>`:''}${l.mia?`<button class="button tiny primary" data-action="plan-mia" ${p.status!=='confirmed'?'disabled':''}>开始Mia作息练习</button>`:''}</article>`).join('')}</div><div class="divider"></div><div class="actions">${p.status==='pending'?`<button class="button primary" data-action="confirm-plan">模拟教师确认本次组合</button><button class="button outline" data-action="return-plan">模拟教师退回调整</button>`:''}<button class="button outline" data-action="plan-review" ${p.status!=='confirmed'?'disabled':''}>模拟阶段复核，决定下一步</button></div><p class="footnote">${p.status==='returned'?esc(p.reason):'确认按钮为教师角色，不代表企业已接受课表。偏好修改后需重新生成并再次确认。'} 已保留${x.history.length}个历史组合版本；不会把一组课程承诺为固定等级结果。</p></section>`:''}${x.reviewed?`<section class="panel section-gap"><div class="panel-title"><h3>04 · 阶段复核后，路线可以转弯</h3><span class="chip amber">示例复核证据 · 非8节真实授课结果</span></div>${evidenceCards(true)}<p class="small muted section-gap">先解释任务证据与剩余困难，再决定继续主需求或转向。下面只调整下一组推荐，不自动购买、排课或保证达标。</p><div class="actions section-gap"><button class="button primary" data-next-need="${q.need}">继续${needNames[q.need]}</button>${Object.entries(needNames).filter(([v])=>v!==q.need).map(([v,t])=>`<button class="button outline" data-next-need="${v}">下一阶段转向${t}</button>`).join('')}</div></section>`:''}<p class="footnote">此区所有诊断导入、阶段完成、教师确认及排课状态均为示例体验。Mia的第三人称作息文字互动、浏览器朗读及写作工坊的起草、规则反馈和修订可实际操作；其他课次展示组合方案，未假装接入全部课程教学。</p>`}

function teacher(){const p=state.practice,pr=prompts[Math.min(p.round,2)];return header('数字老师，接住课后这一问','围绕真人课的一个具体问题练习，把反馈留给教师复核。','AI生成数字形象 · Mia')+`<div class="teacher-layout"><aside class="teacher-profile"><div><div class="overline">YOUR PRACTICE COMPANION</div><h2>Hi, I’m Mia.</h2><p>一起把今天的表达，再练好一点。</p></div>${miaSVG()}<div><span class="chip white">课后练习助手</span><p style="margin-top:12px">今日主题<br><b style="color:#f1f5d9">Daily routines · 日常习惯</b></p></div><div class="profile-foot">Mia形象由AI生成，非真人外教克隆。朗读使用浏览器语音，本体验版未接实时视频与口型驱动。</div></aside><section class="session"><div class="session-top"><div><h3>${p.completed?'本次练习已完成':'Daily routines'}</h3><span class="small muted">${p.started?`第 ${Math.min(p.round+1,3)} / 3 轮 · 目标结构规则检查`:'学习授权待家长确认'}</span></div><div class="progress" aria-label="已完成${p.passed.length}轮，共3轮">${[0,1,2].map(i=>`<i class="${p.passed.includes(i)?'done':''}"></i>`).join('')}</div></div><div class="chatlog" id="chatlog" aria-live="polite">${p.started?p.messages.map(m=>`<div class="bubble ${m.role==='user'?'mine':m.kind==='needs_fix'?'feedback':m.kind==='correct'?'success':''}"><div class="avatar">${m.role==='user'?'YOU':'M'}</div><div class="text">${esc(m.text)}</div></div>`).join(''):`<div class="chat-empty"><div>${icon('shield')}<p>先由家长确认本次示例练习体验授权。</p><button class="button primary section-gap" data-learning="guardian">前往学习授权管理</button></div></div>`}</div><div class="composer">${p.completed?`<div class="review-badge">${icon('check')}<span>已完成3轮。反馈不是正式测评，下一步由教师复核。</span></div><button class="button primary section-gap" data-action="request-review">${state.review.status==='passed'?'查看经复核成长卡':'提交教师复核'} ${icon('arrow')}</button>`:`<label for="answerInput" class="sr-only">输入一句英语日常习惯句</label><textarea id="answerInput" rows="2" maxlength="250" placeholder="试着输入：He goes to school every day." ${!p.started?'disabled':''}>${esc(p.draft||'')}</textarea><div class="examples"><span class="small muted">试填示例：</span><button class="example" data-example="${esc(pr.wrong)}" ${!p.started?'disabled':''}>需要纠正的句子</button><button class="example" data-example="${esc(pr.example)}" ${!p.started?'disabled':''}>目标结构示例</button></div><div class="actions"><button class="button primary" data-action="send" ${!p.started?'disabled':''}>发送这句话 ${icon('arrow')}</button><button class="button outline" data-action="speak" ${!p.started?'disabled':''}>${icon('voice')} 听示范</button><button class="button outline" data-action="mic-toggle" ${!p.started?'disabled':''}>${icon('mic')} 语音输入</button></div>${state.showMic?`<div class="mic-panel"><b>可选语音输入 · 由你主动开启</b><p>仅在点击下方按钮后请求麦克风。浏览器识别服务可能把音频发往浏览器提供商；本页面不保存音频。浏览器不支持或离线时，请直接输入文字。</p><label class="checkline"><input id="micConsent" type="checkbox" ${state.micConsent?'checked':''}><span>我已了解识别方式，同意本次语音输入体验。</span></label><div class="actions"><button class="button tiny outline" data-action="mic-start" ${!state.micConsent?'disabled':''}>开始一次语音输入</button><button class="button tiny outline" data-action="mic-stop">停止</button><span id="micStatus" class="small muted"></span></div></div>`:''}<small>按 Ctrl / ⌘ + Enter 发送。只练目标句式；不会生成发音分数。请勿输入个人信息。</small>`}</div></section></div><div class="notice neutral section-gap">功能说明：文字练习采用目标教学规则与常见课堂交互：检查目标句式、提示动词变化、说明范围；支持问候/感谢、why-goes规则解释、help支架与bye暂停，这些交互不算答对或推进轮次。示范语音调用浏览器朗读；语音识别须浏览器支持。未接通用大模型、正式语音测评或真人教师。</div>`}

function financePanel(){const inc=finance.scenarios?.base||{},u=inc.unitEconomics||{};const price=Number(inc.price??49),ai=Number(inc.aiCloud??4),review=Number(inc.teacherReview??12),service=Number(inc.support??4),reward=Number(inc.partnerReward??6),rr=Number(inc.refundRate??.03),pay=Number(inc.paymentRate??.006),net=price*(1-rr),payCost=price*pay,contribution=net-ai-review-service-reward-payCost;return `<section class="panel"><div class="panel-title"><h3>增值服务单位经济</h3><span class="chip amber">试点假设 · 非企业现行报价</span></div><p class="small muted">仅计算新增服务；现有真人基课的收入、履约成本与原佣金均不进入此表。</p><div class="table-wrap section-gap"><table><thead><tr><th>单用户月口径</th><th>人民币</th></tr></thead><tbody><tr><td>增值服务标价</td><td>¥${price.toFixed(2)}</td></tr><tr><td>预计退款 ${Math.round(rr*100)}%</td><td>−¥${(price*rr).toFixed(3)}</td></tr><tr><td>AI云资源增量</td><td>−¥${ai.toFixed(2)}</td></tr><tr><td>教师复核</td><td>−¥${review.toFixed(2)}</td></tr><tr><td>教服支持</td><td>−¥${service.toFixed(2)}</td></tr><tr><td>伙伴任务奖励预算</td><td>−¥${reward.toFixed(2)}</td></tr><tr><td>支付费用 ${+(pay*100).toFixed(2)}%</td><td>−¥${payCost.toFixed(3)}</td></tr><tr class="total"><td>预计用户月增量贡献</td><td>¥${contribution.toFixed(3)}</td></tr></tbody></table></div><p class="footnote">贡献=标价×(1−退款率)−AI−教师复核−教服−任务奖−支付费用。未扣交叉销售获客与固定试点投入、税费未计。教师复核按4次×3分钟×60元/小时估算；全部需实测，不是实际利润。</p><details class="detail-toggle"><summary>为什么保留免费AI，却仍验证付费？</summary><p>已有免费AI功能不等于家庭会为更多AI付费。49元的待验证价值是教材与真人课堂衔接、教师复核和持续成长服务。若家长只需要免费练习，应继续使用免费能力，不强制升级。</p></details></section>`}
function forecastPanel(){const c=finance.scenarios?.base?.monthly||[],summary=finance.scenarios?.base?.summary||{};if(!Array.isArray(c)||!c.length)return `<section class="panel soft"><div class="panel-title"><h3>把试点假设，与实测事件分开</h3><span class="chip line">验证设计</span></div><div class="benefits"><div class="benefit">${icon('partner')}<div><b>验证渠道增量</b><p>伙伴分组对照：统一邀请页与成长服务是否提高有效咨询率和体验完成率。</p></div></div><div class="benefit">${icon('shield')}<div><b>验证服务成本</b><p>记录真实复核分钟数、返工率与教服工时，再校准单位经济。</p></div></div><div class="benefit">${icon('board')}<div><b>验证独立付费意愿</b><p>已有免费AI基础上观察实际购买、退款和跨月续费，不把点击当收入。</p></div></div></div><p class="footnote">当前浏览器只有示例家庭和模拟事件，不能用于证明转化提升或收益预测。</p></section>`;const vals=c.map(v=>Number(v.billedSubscribers??0)),max=Math.max(...vals,1);return `<section class="panel soft"><div class="panel-title"><h3>6个月队列预测</h3><span class="chip amber">模型假设 · 独立于当前体验</span></div><p class="small muted">基准：${priceValue()}元/月，次月计费留存${Math.round((finance.scenarios?.base?.retention??0)*100)}%，月新增${(finance.scenarios?.base?.newSubscribers||[]).join('/')}。以下为计费用户月期望值；浏览器事件不进入预测。</p><div class="spark-bars">${c.map((v,i)=>`<div class="spark-col" style="height:${Math.max(vals[i]/max*85,2)}px"><span>${Math.round(vals[i])}</span><small>M${esc(v.month??(i+1))}</small></div>`).join('')}</div><div class="table-wrap"><table><thead><tr><th>月份</th><th>计费用户月</th><th>增量贡献</th></tr></thead><tbody>${c.map((v,i)=>`<tr><td>M${esc(v.month??(i+1))}</td><td>${vals[i].toFixed(2)}</td><td>¥${Number(v.contribution??0).toLocaleString('zh-CN',{maximumFractionDigits:0})}</td></tr>`).join('')}</tbody></table></div><p class="footnote">六个月累计现金为 ¥${Number(summary.netIncrementalCash??0).toLocaleString('zh-CN',{maximumFractionDigits:2})}，尚未回收固定投入；总支出 ¥${Number(summary.grossCashOutlay??0).toLocaleString('zh-CN',{maximumFractionDigits:2})}，受控试验封顶6万元。此图为D级假设，非企业经营结果；小数为期望用户数。统一模型：${esc(finance.canonicalModelId||'')}。</p></section>`}

rialActions():''}</section><section class="panel"><div class="panel-title"><h3>可追踪事件流</h3><span class="chip line">${state.events.length}条 · 去重</span></div><div class="eventlist">${state.events.length?[...state.events].reverse().map(e=>`<div class="event"><b>${esc(labels[e.type]||e.type)}</b><small>${esc(e.entity)} · ${new Date(e.at).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}${e.detail?' · '+esc(e.detail):''}</small></div>`).join(''):'<div class="empty">开始一次伙伴邀约，事件会逐步出现在这里。</div>'}</div></section></div><div class="grid cols-even section-gap">${financePanel()}${forecastPanel()}</div>`}

function addLedgerOrder(id,kind,family,period){const b=state.business;if(b.orders.some(o=>o.id===id))return false;const c=structuredClone(b.contract);b.orders.push({id,kind,family,period,contract:c,paid:kind==='base'?c.price:49,units:kind==='base'?c.units:1,delivered:0,taskVerified:false,windowClosed:false,refund:0,creditedDelivered:0,refundRequest:null,paidOut:0,appeal:false,source:'B-017',sourceRule:'首次有效推荐；冲突交人工复核',snapshot:'QD-FINAL-CONTRACT-D1'});logBusiness('模拟支付',id+'：'+(kind==='base'?c.price:49)+'元；同一订单只建一次，不代表真实收款。');return true;}
function orderById(id){return state.business.orders.find(o=>o.id===id);}
function orderNumbers(o){const c=o.contract,grossEarned=o.paid*o.delivered/o.units,recognized=Math.max(0,grossEarned-o.creditedDelivered),liability=Math.max(0,o.paid-o.refund-recognized),earned=o.kind==='base'?recognized*c.rate:(o.taskVerified?6:0),teacher=o.kind==='base'?o.delivered*c.teacherPerUnit:(o.taskVerified?12:0),support=o.kind==='base'?o.delivered*c.opsPerUnit:(o.taskVerified?4:0),cloud=o.kind==='addon'?4:0,fee=o.paid*c.paymentRate,contribution=recognized-earned-teacher-support-cloud-fee,blocked=!!o.refundRequest||o.appeal,balance=earned-o.paidOut;return {recognized,liability,earned,teacher,support,cloud,fee,contribution,balance,blocked,eligible:o.windowClosed&&!blocked?Math.max(0,balance):0,offset:Math.max(0,-balance)};}
function deliverOrder(id){const o=orderById(id);if(!o||o.refundRequest||o.refund>0||o.appeal||o.delivered>=o.units)return false;if(o.kind==='addon'){if(o.period==='M1'&&(!['needs','boundary','explain'].every(k=>state.tasks[k])||state.review.status!=='passed')){tell('M1成长服务需完成三项伙伴任务及教师复核。');return false;}if(o.period!=='M1'&&!o.taskVerified){tell('次月需单独核验该月服务，不能沿用M1证据。');return false;}o.taskVerified=true;}o.delivered++;logBusiness('模拟履约',id+'：'+o.delivered+'/'+o.units+'，体验验收，非真实上课记录。');commit();return true;}
function verifyPeriod(id){const o=orderById(id);if(!o||o.kind!=='addon'||o.period==='M1'||o.refund>0||o.delivered)return false;o.taskVerified=true;logBusiness('次月独立验收',id+'：模拟新期间的目标确认、复核报告送达和家长跟进；非复用M1。');commit();return true;}

function settleOrder(id){const o=orderById(id);if(!o)return false;const n=orderNumbers(o);if(n.eligible<=0){tell('尚无可结算收益，先履约、结束体验观察期并处理争议。');return false;}const pending=state.business.orders.some(x=>x.refundRequest||x.appeal);const offset=ledgerTotals().offset;if(pending||offset>0){tell(pending?'存在待处理退款或申诉，体验暂缓结算。':'存在历史冲回余额，先完成抵扣对账。');return false;}o.paidOut+=n.eligible;logBusiness('模拟结算',id+'：向B-017结算'+money(n.eligible)+'元，保留历史支付记录。');commit();return true;}
function requestRefund(id,mode){const o=orderById(id);if(!o||o.refundRequest||o.refund>0||!['remaining','quality'].includes(mode))return false;const amount=mode==='quality'?o.paid:o.paid*(o.units-o.delivered)/o.units;if(amount<=0)return false;o.refundRequest={mode,amount,reason:mode==='quality'?'体验质量争议，申请S审核全额补偿':'退未履约部分，按本体验协议折算'};logBusiness('退款申请',id+'：'+money(amount)+'元，待S核实，暂停相关结算。');commit();return true;}
function approveRefund(id){const o=orderById(id);if(!o?.refundRequest)return false;const r=o.refundRequest;o.refund=r.amount;if(r.mode==='quality')o.creditedDelivered=o.paid*o.delivered/o.units;o.refundRequest=null;logBusiness('S模拟退款审核',id+'：退'+money(o.refund)+'元；已发生教师/教服/通道成本保留，质量补偿冲减基课佣金，合格服务奖不按分享或退费自动扣除。');commit();return true;}
function rejectRefund(id){const o=orderById(id);if(!o?.refundRequest)return false;o.refundRequest=null;logBusiness('S模拟退回补充证据',id+'：未变更退款及应得金额，保留原申请；家庭可补充后重新提出，不等于真实拒绝权利。');commit();return true;}
function appealOrder(id){const o=orderById(id);if(!o||o.appeal)return false;o.appeal=true;logBusiness('B对账申诉',id+'：体验提出归属或结算复核，资金暂缓；人工决定前不改金额。');commit();return true;}
function resolveAppeal(id){const o=orderById(id);if(!o?.appeal)return false;o.appeal=false;logBusiness('S模拟人工复核',id+'：核对订单、服务证据与协议，维持当前试算；保留申诉与决定，不自动加奖。');commit();return true;}
function applyOffset(){const b=state.business;if(b.orders.some(o=>o.refundRequest||o.appeal))return false;let need=ledgerTotals().offset;if(need<=0)return false;const credits=b.orders.filter(o=>orderNumbers(o).eligible>0),debts=b.orders.filter(o=>orderNumbers(o).offset>0);let applied=0;for(const cr of credits){let available=orderNumbers(cr).eligible;for(const db of debts){const delta=Math.min(available,orderNumbers(db).offset);if(delta>0){cr.paidOut+=delta;db.paidOut-=delta;available-=delta;applied+=delta;}}}if(applied===0){tell('尚无可抵扣的到期收益，冲回余额留至后续人工处理。');return false;}logBusiness('跨单抵扣对账','抵扣'+money(applied)+'元；此操作不产生新现金支付，历史现金支出仍保留在审计记录。');commit();return true;}
function ledgerTotals(){return state.business.orders.reduce((t,o)=>{const n=orderNumbers(o);for(const k of ['recognized','liability','earned','teacher','support','cloud','fee','contribution','eligible','offset'])t[k]+=n[k];t.collections+=o.paid;t.refunds+=o.refund;t.netSettled+=o.paidOut;return t;},{collections:0,refunds:0,recognized:0,liability:0,earned:0,teacher:0,support:0,cloud:0,fee:0,contribution:0,eligible:0,offset:0,netSettled:0});}

function setWritingConsent(value,source='manual'){const w=state.writing;if(!value&&w.history.length){tell('已有写作记录；撤回后停止新增检查，可重置清除本机记录。');}w.consent=!!value;w.consentSource=value?source:'';if(value)event('writing_consent','F-001',source==='scripted'?'流程中的独立写作授权':'家长单独确认本次示例写作文字处理');commit();return true;}
function openStudentPractice(kind){if(!hasFamilyAccess()){tell('先载入示例学习档案，或由伙伴邀请进入。');return false;}if(kind==='writing'){navigate('writing');return true;}if(!state.practiceConsent){state.learnerView='guardian';navigate('parent');tell('请家长确认口语练习授权，再返回学生学习。');return false;}return startPractice();}
function setWritingTopic(topic){if(!writingTopics[topic])return false;const w=state.writing;if(w.topic===topic)return true;w.topic=topic;w.draft='';w.analysis=null;w.status='draft';w.checks={content:false,language:false};w.teacherNote='';w.linkedPlanVersion=null;commit();return true;}
function setWritingDraft(text){const w=state.writing;w.draft=String(text||'').slice(0,5000);w.analysis=null;w.status='draft';w.checks={content:false,language:false};w.teacherNote='';save();const live=$('#writingLive');if(live)live.textContent=wordList(w.draft).length+'词 · 稿件有修改，需重新检查';const status=$('#writingDraftStatus');if(status)status.textContent='稿件已修改 · 原确认失效';const f=$('#writingFeedback');if(f)f.innerHTML='<div class="empty">稿件已修改。重新检查后生成本稿建议，旧教师确认已失效。</div>';const r=$('#writingTeacher');if(r)r.innerHTML='<p class="small muted">先检查当前稿件，再提交教师复核。</p>';return true;}
function loadWritingExample(){if(state.writing.draft.trim()){tell('已有稿件；请先自行保存或清空，示例不会覆盖你的文字。');return false;}setWritingDraft(writingTopics[state.writing.topic].sample);commit();tell('已载入原创示例示例，不是学生作品或标准答案。');return true;}
function checkWriting(){const w=state.writing;if(!hasFamilyAccess()){tell('请先载入示例学习档案。');return false;}if(!w.consent){tell('请家长在家长管理区单独确认写作授权。');return false;}const a=analyzeWriting(w.draft,w.topic);if(!a.words){tell('先写下英文句子，再查看修改建议。');return false;}const prev=w.history[w.history.length-1];if(!prev||prev.text!==a.text||prev.topic!==w.topic||prev.planVersion!==w.linkedPlanVersion)w.history.push({planVersion:w.linkedPlanVersion,version:w.history.length+1,topic:w.topic,text:a.text,at:new Date().toISOString(),words:a.words});a.version=w.history.length;w.analysis=a;w.status='checked';w.checks={content:false,language:false};w.teacherNote='';event('writing_checked','WRITING-'+a.version,'本机规则检查当前稿件；非正式评分');commit();return true;}
function submitWritingReview(){const w=state.writing;if(!w.consent||!w.analysis||w.analysis.text!==w.draft.trim()||w.analysis.words<15){tell('至少完成15词的有效尝试并检查当前稿件后再提交。');return false;}if(w.status==='passed')return false;w.status='pending';w.checks={content:false,language:false};event('writing_review_request','WRITING-'+w.analysis.version,'模拟提交教师，规则建议不等于教师判断');commit();return true;}
function setWritingChecks(content,language){state.writing.checks={content:!!content,language:!!language};commit();return true;}
function setWritingNote(text){state.writing.teacherNote=String(text||'').slice(0,600);save();return true;}
function approveWriting(){const w=state.writing;if(!w.consent||w.status!=='pending'||!w.analysis||w.analysis.text!==w.draft.trim()||!w.checks.content||!w.checks.language||!w.teacherNote.trim()){tell('教师须核对内容与表达，并填写具体意见；稿件修改后要重新送审。');return false;}w.status='passed';w.reviewedAt=new Date().toISOString();w.reviewedVersion=w.analysis.version;const entry=w.history.find(v=>v.version===w.analysis.version);if(entry)entry.teacherReview={status:'passed',note:w.teacherNote,at:w.reviewedAt,simulated:true};event('writing_review_pass','WRITING-'+w.analysis.version,'模拟教师复核；不承诺无错、正式分数或等级');commit();return true;}
function returnWriting(){const w=state.writing;if(!w.consent||w.status!=='pending')return false;w.status='returned';w.teacherNote=w.teacherNote.trim()||'请补充任务遗漏的信息，并核对句子表达后重新提交。';const entry=w.history.find(v=>v.version===w.analysis.version);if(entry)entry.teacherReview={status:'returned',note:w.teacherNote,at:new Date().toISOString(),simulated:true};event('writing_review_return','WRITING-'+w.analysis.version,w.teacherNote);commit();return true;}
function useWritingForPlan(){const w=state.writing;if(!w.consent||w.status!=='passed'||!w.analysis||w.analysis.text!==w.draft.trim()){tell('当前稿件须先经教师复核。');return false;}if(!state.personal.diagnosisImported||!state.personal.foundationEvidenceReady){tell('写作记录已保留，请先在课程定制中载入入学资料并查看基础任务证据。');navigate('custom');return false;}state.personal.writingEvidence={version:w.analysis.version,topic:w.topic,words:w.analysis.words,teacherNote:w.teacherNote,source:'本机写作记录与模拟教师复核'};updatePreferences({need:'writing',goal:writingTopics[w.topic].goalKey,cross:['grammar','reading']});generatePlan();event('writing_to_plan','WRITING-'+w.analysis.version,'依据已复核稿件形成待教师确认的写作课程建议，不自动购买或排课');navigate('custom');return true;}
function routeToWriting(){const p=state.personal.plan;if(!p||p.status!=='confirmed'||!p.lessons.some(l=>l.writing)){tell('本次组合须经教师确认，并包含写作任务。');return false;}const topic=p.preferences.goal==='description'?'friend':p.preferences.goal==='story'?'weekend':'routine';if(state.writing.topic!==topic)setWritingTopic(topic);if(state.writing.linkedPlanVersion!==p.version)setWritingDraft(state.writing.draft);state.writing.linkedPlanVersion=p.version;event('plan_writing_link','PLAN-'+p.version,'课程目标衔接本机写作试练，作品需另行复核');navigate('writing');return true;}
function learnerTabs(){return `<div class="learner-tabs" role="group" aria-label="学习与监护管理视图"><button class="button ${state.learnerView==='student'?'primary':'outline'}" data-learning="student">学生学习</button><button class="button ${state.learnerView==='guardian'?'primary':'outline'}" data-learning="guardian">家长管理</button><span class="small muted">学生上课练习，家长管理授权和费用</span></div>`;}
parent=function(){return state.learnerView==='guardian'?guardianPage():studentPage();};
function studentPage(){const w=state.writing;return header('今天，学什么由目标决定','看自己的课程安排，和Mia练习，再用一篇小作文整理表达。','学生学习 · 体验账号')+learnerTabs()+`<section class="hero section-gap"><div><div class="overline">MY LEARNING SPACE</div><h2>先把一个目标学扎实</h2><p>口语、听力、语法与写作可以交叉安排。需要调整时，把作品和具体困难交给教师复核。</p></div><div class="actions"><button class="button white" data-nav="custom">查看我的私人课程</button>${!hasFamilyAccess()?'<button class="button white" data-learning="sample">载入示例学习档案</button>':''}</div></section><div class="learning-cards"><section class="panel"><span class="chip">01 · 口语表达</span><h2 class="section-gap">跟Mia说一说</h2><p class="help">围绕日常作息完成三轮问答，自己改正句子。</p><button class="button primary section-gap" data-learning="oral">${state.practice.started?'继续口语练习':'开始口语练习'}</button><p class="footnote">${state.practiceConsent?'家长授权已确认':'首次使用请家长确认练习授权'}</p></section><section class="panel"><span class="chip">02 · 写作表达</span><h2 class="section-gap">把想法写成小短文</h2><p class="help">选题、起草、检查和修订，保留每一稿，再请教师看。</p><button class="button primary section-gap" data-learning="writing">进入写作工坊</button><p class="footnote">当前：${writingNames[w.status]} · ${wordList(w.draft).length}词</p></section><section class="panel"><span class="chip">03 · 听力理解</span><h3 class="section-gap">听懂信息，再回应</h3><p class="help">依据阶段目标安排听力与口语、写作的交叉任务。</p><button class="button outline section-gap" data-learning="listening">安排听力目标</button></section><section class="panel"><span class="chip">04 · 语法运用</span><h3 class="section-gap">让句子表达更完整</h3><p class="help">用说话和写作中的问题选择语法任务，避免只背规则。</p><button class="button outline section-gap" data-learning="grammar">安排语法目标</button></section></div><section class="panel section-gap"><div class="panel-title"><h3>我的学习记录</h3><button class="button outline" data-nav="archive">查看口语与写作档案</button></div><p class="small muted">口语：${state.practice.passed.length}/3轮 · ${state.review.status==='passed'?'教师已复核':'待完成与复核'}；写作：${w.history.length}个稿件版本 · ${writingNames[w.status]}。</p><p class="help">课程组合和作品只帮助解释学习过程，不代表考试分数或等级保证。费用与公开分享由家长决定。</p></section>`;}
function guardianPage(){return header('家长管理：了解进展，再作决定','课程供学生学习；这里管理学习授权、费用、阶段回执和自愿分享。','监护人视图 · 角色体验')+learnerTabs()+`<div class="grid cols-even section-gap"><section class="panel"><h3>学习使用授权</h3><p class="help">使用示例身份，不填写真实儿童姓名、学校或联系方式。口语和写作分别确认，均不会自动同意公开分享。</p><label class="consent section-gap"><input id="practiceConsent" type="checkbox" ${state.practiceConsent?'checked':''} ${state.practice.started?'disabled':''}><span>我以家长角色同意本次示例口语练习体验。<small>文字只保存在本机；麦克风需另行主动开启。</small></span></label><label class="consent section-gap"><input id="writingConsent" type="checkbox" ${state.writing.consent?'checked':''}><span>另行同意本次示例写作文字的检查、修订记录与复核体验。<small>写作稿件仅用于学习，不随口语分享卡对外公开。</small></span></label><div class="actions section-gap"><button class="button primary" data-learning="student">返回学生学习</button><button class="button outline" data-nav="writing">前往写作工坊</button></div><p class="footnote">角色切换用于呈现职责，生产环境仍须真实监护账号与权限验证。</p></section><section class="panel"><h3>阶段回执</h3><div class="lesson"><b>口语练习</b><p class="small">${state.review.status==='passed'?'模拟教师已复核日常作息目标。':'目标任务完成后由教师复核，再提出下一步建议。'}</p></div><div class="lesson"><b>写作练习 · ${writingTopics[state.writing.topic].title}</b><p class="small">${writingNames[state.writing.status]}；${state.writing.analysis?state.writing.analysis.words:0}词，${state.writing.history.length}稿。</p>${state.writing.teacherNote?`<p class="small">教师意见（模拟）：${esc(state.writing.teacherNote)}</p>`:''}</div><button class="button outline" data-nav="archive">查看证据与成长档案</button></section><section class="panel"><div class="panel-title"><h3>可选成长服务</h3><span class="chip line">试点价格假设</span></div><div class="price-card"><strong>¥49</strong><span class="small muted"> / 用户月</span><p>原口语目标练习、约定教师复核和成长服务；原有免费AI、真人课包权益保留。</p></div><div class="actions section-gap"><button class="button primary" data-action="purchase" ${state.purchase||!hasFamilyAccess()?'disabled':''}>${state.purchase?'已模拟购买':'模拟购买 · 不收款'}</button><button class="button outline" data-action="renew" ${!state.purchase||state.renewal?'disabled':''}>${state.renewal?'已模拟次月续费':'模拟次月续费'}</button></div><p class="help">本次写作试练不增加订单；长作文真人批改与额外教研不自动纳入49元，需测工时后另行确认范围和报价。</p></section><section class="panel"><h3>分享由家长自主决定</h3><p class="help">学习授权不等于公开授权。口语成果卡需教师复核并单独授权；写作全文在本体验版中不提供公开分享。</p><button class="button outline section-gap" data-nav="archive">查看口语匿名分享入口</button></section></div>`;}
function writingFeedback(){const a=state.writing.analysis;if(!a)return '<div class="empty">先写下自己的文字，点击“检查这一稿”查看具体建议。</div>';return `<div class="writing-stats"><span><b>${a.words}</b>词</span><span><b>${a.sentences}</b>个分句</span><span><b>${a.unique}</b>种英文词形</span><span>稿件 V${a.version}</span></div><div class="review-badge ${a.lengthOK?'':'pending'}">字数观察：${a.lengthOK?'处于40—70词目标范围':'目标为40—70词，可按实际起点与教师建议调整'}</div><h4 class="section-gap">内容是否覆盖任务</h4>${a.content.map(c=>`<div class="evidence-row"><b>${c.observed?'已出现相关词':'待核对'}</b> · ${esc(c.label)}<p class="small muted">${c.observed?'关键词仅为线索，是否完整表达仍由你和教师核对。':'看看是否写清这一点；不要求照抄提示词。'}</p></div>`).join('')}<h4 class="section-gap">可定位的句子建议</h4>${a.issues.length?a.issues.map(i=>`<div class="writing-issue"><b>“${esc(i.quote)}”</b><p>${esc(i.advice)}</p></div>`).join(''):'<p class="small muted section-gap">本地规则未发现所覆盖的常见结构问题，仍需教师检查语义、时态和整体表达。</p>'}<h4 class="section-gap">组织与修订</h4><p class="small muted section-gap">${a.sequence?'已出现顺序表达，检查是否符合事件先后。':'可尝试用first、then或after school说明先后，避免每句都使用同一开头。'} 核对开头交代主题、每句补充一条相关信息、结尾回应主题。先改一项，再检查二稿。</p><p class="footnote">本页按本地规则反馈，没有通用大模型批改、作文总分、等级评定或自动代写。</p>`;}
function writingTeacher(){const w=state.writing;if(!w.analysis)return '<p class="small muted">先检查当前稿件，再提交教师复核。</p>';return `<div class="actions"><button class="button primary" data-writing="submit" ${w.analysis.words<15||w.status==='pending'||w.status==='passed'||!w.consent?'disabled':''}>提交这一稿教师复核</button></div>${w.status==='pending'?`<div class="teacher-review-box section-gap"><b>教师处理</b><label class="checkline"><input type="checkbox" id="writingContentCheck" ${w.checks.content?'checked':''}>核对任务内容与表达是否一致</label><label class="checkline"><input type="checkbox" id="writingLanguageCheck" ${w.checks.language?'checked':''}>核对语言问题、提示程度及下一步建议</label><label class="small" for="writingTeacherNote">具体复核意见（教师角色模拟）</label><textarea class="writing-note" id="writingTeacherNote" maxlength="600" ${!w.consent?'disabled':''} placeholder="写明本稿观察和下一步任务，不能只写分数。">${esc(w.teacherNote)}</textarea><div class="actions section-gap"><button class="button primary" data-writing="approve" ${!w.consent?'disabled':''}>模拟教师完成复核</button><button class="button outline" data-writing="return" ${!w.consent?'disabled':''}>退回学生修改</button></div></div>`:''}${w.teacherNote&&w.status!=='pending'?`<div class="lesson"><b>教师意见（模拟）</b><p>${esc(w.teacherNote)}</p></div>`:''}${w.status==='passed'?'<button class="button outline section-gap" data-writing="to-plan">把写作目标带入下一组课程</button>':''}<p class="footnote">修改任何文字或切换题目后原确认失效。教师按钮为角色体验，不是真实教师在线服务。</p>`;}
function writing(){const w=state.writing,t=writingTopics[w.topic];return header('写作工坊：从想法到一段清楚的表达','写一稿，改一处，再交给教师看；每次修改都有记录。','学生写作 · 本机规则试练')+`<div class="writing-layout"><aside class="panel writing-brief"><span class="chip">本次任务</span><label for="writingTopic" class="small section-gap" style="display:block">写作主题</label><select class="biz-input" id="writingTopic">${Object.entries(writingTopics).map(([k,v])=>`<option value="${k}" ${w.topic===k?'selected':''}>${v.title}</option>`).join('')}</select><h2 class="section-gap">${t.title}</h2><p class="help">${t.goal}</p><div class="tasklist section-gap">${t.prompts.map((x,i)=>`<div class="task"><span class="number">${i+1}</span><p>${esc(x)}</p></div>`).join('')}</div><button class="button outline section-gap" data-writing="example">载入原创示例示例</button><p class="footnote">示例只帮助理解题目，不是学生作品或唯一答案。</p><div class="divider"></div><span class="chip ${w.consent?'':'amber'}">${w.consent?'家长写作授权已确认':'待家长确认写作授权'}</span><button class="button outline section-gap" data-learning="guardian">请家长查看授权与管理</button><p class="footnote">课包价格和正式批改权益另行确认，试练不创建付费订单。</p></aside><section class="panel"><div class="panel-title"><h3>我的稿件</h3><span id="writingDraftStatus" class="chip ${w.status==='passed'?'':'amber'}">${writingNames[w.status]}</span></div>${!hasFamilyAccess()?'<div class="notice">请在学生学习页载入示例学习档案，或由伙伴邀请进入。</div>':''}<label for="writingInput" class="small">先写自己的英文短文</label><textarea id="writingInput" class="writing-editor" maxlength="5000" placeholder="Write your own paragraph here…" ${!hasFamilyAccess()||!w.consent?'disabled':''}>${esc(w.draft)}</textarea><div class="actions"><span id="writingLive" class="small muted">${wordList(w.draft).length}词 · ${writingNames[w.status]}</span><button class="button primary" data-writing="check" ${!hasFamilyAccess()||!w.consent?'disabled':''}>检查这一稿</button><button class="button outline" data-writing="student">返回学生学习</button></div><div class="divider"></div><div id="writingFeedback">${writingFeedback()}</div><div class="divider"></div><div id="writingTeacher">${writingTeacher()}</div><details class="section-gap"><summary>查看已检查稿件（${w.history.length}个版本）</summary>${w.history.slice().reverse().map(v=>`<article class="saved-draft"><b>V${v.version} · ${writingTopics[v.topic].title} · ${v.words}词</b><p>${esc(v.text)}</p>${v.teacherReview?`<p class="small muted">该稿教师意见（模拟）：${esc(v.teacherReview.note)}</p>`:''}</article>`).join('')||'<p>检查稿件后保留版本，输入中的文字也会在本机暂存。</p>'}</details></section></div>`;}
function writingArchive(){const w=state.writing;return `<section class="panel section-gap"><div class="panel-title"><h3>写作成长记录</h3><span class="chip ${w.status==='passed'?'':'amber'}">${writingNames[w.status]}</span></div><p class="small muted">主题：${writingTopics[w.topic].title} · 已检查${w.history.length}个版本 · 当前稿件${wordList(w.draft).length}词。次数和字数描述过程，不是能力分数。</p>${w.analysis?`<div class="lesson"><b>当前V${w.analysis.version}的学习证据</b><p class="small">任务内容：${w.analysis.content.filter(c=>c.observed).length}/3项出现相关词；规则提示${w.analysis.issues.length}处。关键词覆盖不等于内容质量。</p></div>`:''}${w.teacherNote?`<p class="small section-gap">教师复核意见（模拟）：${esc(w.teacherNote)}</p>`:''}<div class="actions section-gap"><button class="button primary" data-nav="writing">继续写作与修改</button><button class="button outline" data-writing="to-plan" ${w.status!=='passed'?'disabled':''}>将写作需求交给课程规划</button></div><p class="footnote">写作全文不随口语匿名成长卡公开。新课程由教师确认，不自动付费。</p></section>`;}
const previousArchive=archive;

const _miaOrig = {analyze, submitAnswer, render, speech};
let _miaRate = 0.86;

/* 朗读：中英混排时只读英文，避免卡顿 */
function miaSpeak(text, rate){
  if(!('speechSynthesis' in window)) return false;
  window.speechSynthesis.cancel();
  let clean = String(text==null?'':text)
    .replace(/[\u4e00-\u9fa5\u3000-\u303f\uff00-\uffef]+/g,' ')
    .replace(/[“”’]/g,"'").replace(/\n+/g,'. ').replace(/\s+/g,' ').trim();
  if(!clean || !/[a-zA-Z]/.test(clean)) return false;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang='en-US'; u.rate=rate||_miaRate; u.pitch=1;
  const vs = window.speechSynthesis.getVoices()||[];
  const en = vs.find(v=>/^en[-_]/i.test(v.lang)&&v.localService) || vs.find(v=>/^en[-_]/i.test(v.lang));
  if(en) u.voice=en;
  const vis = document.getElementById('miaVisual');
  u.onstart = ()=>{ vis && vis.classList.add('speaking'); };
  const stop = ()=>{ vis && vis.classList.remove('speaking'); };
  u.onend = stop; u.onerror = stop;
  try{ window.speechSynthesis.speak(u); return true; }catch(e){ return false; }
}

/* 意图识别（在原有规则之前先跑） */
function miaIntents(raw){
  const t = String(raw==null?'':raw).trim().replace(/\s+/g,' ');
  if(!t) return null;
  const low = t.toLowerCase();
  const cur = miaCurrentPrompt();

  // 报名字
  let nm = low.match(/(?:my name is|my name's|i am|i'm|call me|this is)\s+([a-z][a-z'\-]{1,15})/)
        || t.match(/我叫\s*([\u4e00-\u9fa5A-Za-z]{2,10})/);
  if(nm && !/^(fine|ok|okay|good|here|sorry|ready|done)$/i.test(nm[1])){
    const name = nm[1].replace(/^./,c=>c.toUpperCase());
    state.practice.studentName = name;
    return {kind:'classroom', subtype:'name',
      feedback:`Nice to meet you, ${name}! I'm Mia, your English teacher.\nLet's keep going.\n${cur.ask}\n${cur.hint}`};
  }
  // 问 Mia 是谁 / 名字
  if(/what.{0,14}(your name|are you called)|who are you|你叫什么|你是谁/i.test(low)){
    const n = miaName();
    return {kind:'classroom', subtype:'myname',
      feedback:`I'm Mia, your English teacher here.\nI help you practise speaking and writing, and I pass your work to a teacher for review.\nNow back to our task${n?'，'+n:''}.\n${cur.ask}`};
  }
  // 寒暄
  if(/how are you|how's it going|how is it going|你好吗|最近怎么样/i.test(low)){
    const n = miaName();
    return {kind:'classroom', subtype:'feeling',
      feedback:`I'm doing well, thank you for asking${n?', '+n:''}. And you?\nWhen you're ready, let's continue.\n${cur.ask}`};
  }
  // 重复 / 慢速
  if(/(say|read|speak).{0,16}(again|slower)|slow down|repeat (it|that)|one more time|再说一遍|再说一次|慢一点|再读一遍|没听清/i.test(low)){
    miaSpeak(cur.example, 0.6);
    return {kind:'classroom', subtype:'repeat',
      feedback:`Here it is again, slowly:\n${cur.example}\nNow you try. Say it back to me.`};
  }
  // 跟读
  if(/跟读|read after me|follow (you|me)|i.ll repeat|我跟你读/i.test(low)){
    state.practice.following = true;
    miaSpeak(cur.example, 0.76);
    return {kind:'classroom', subtype:'follow',
      feedback:`Good idea. Listen first, then read it back:\n${cur.example}\nI'll compare what you say — no score, just closeness.`};
  }
  // 没听懂
  if(/(don't|do not|can't|cannot)\s+(understand|get it)|what do you mean|没听懂|听不懂|不明白/i.test(low)){
    return {kind:'classroom', subtype:'notunderstand',
      feedback:`No problem, let me say it differently.\nWe are practising the simple present for he / she / it. One person means the verb changes: go becomes goes, read becomes reads.\nTry this one:\n${cur.example}`};
  }
  // 天气/感受闲聊
  if(/weather|sunny|rainy|cloudy|windy|cold|hot|tired|happy|sad|busy/i.test(low)){
    return {kind:'classroom', subtype:'chat',
      feedback:`Thanks for telling me! Let's put it in English first.\nYou can say: It is sunny today. / I am a little tired today.\nThen let's go back to our task.\n${cur.ask}`};
  }
  return null;
}

/* 跟读比对（Jaccard，不给分数只给接近度） */
function miaCompare(raw){
  const cur = miaCurrentPrompt();
  const tok = x=>String(x==null?'':x).toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  const A = tok(cur.example), B = tok(raw);
  if(!B.length) return null;
  const sa = new Set(A), sb = new Set(B);
  let hit = 0; sa.forEach(w=>{ if(sb.has(w)) hit++; });
  const score = hit / Math.max(sa.size, sb.size);
  state.practice.following = false;
  const n = miaName();
  if(score >= 0.85){
    return {kind:'classroom', subtype:'follow_ok',
      feedback:`That was very close to my sentence${n?', '+n:''}. Well done!\nMy line: ${cur.example}\nYour line: ${String(raw).trim()}\nNow let's finish the lesson task.\n${cur.ask}`};
  }
  const missing = [...sa].filter(w=>!sb.has(w)).slice(0,5);
  return {kind:'classroom', subtype:'follow_retry',
    feedback:`Close, but not quite. Let's try once more.\nWords I did not hear: ${missing.join(', ')}\nMy line: ${cur.example}`};
}

};

    .slice(-10)

function miaScrollBottom(){
  requestAnimationFrame(()=>{
    const c = document.getElementById('chatlog'); if(c) c.scrollTop = c.scrollHeight;
    const i = document.getElementById('answerInput'); if(i) i.focus();
  });
}

function miaAskServer(){
  const ctl = new AbortController();
  const timer = setTimeout(()=>ctl.abort(), 11000);
  return fetch(MIA_API, {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({messages: miaHistory(), task: miaTaskText()}),
    signal: ctl.signal
  }).then(r=>r.json()).then(d=>{
    clearTimeout(timer);
    if(d && d.reply) return String(d.reply);
    throw new Error((d && d.error) || 'empty');
  }).catch(e=>{ clearTimeout(timer); throw e; });
}

/* 覆写 submitAnswer：答对判分/轮次仍走原逻辑；闲聊与自由输入交给大模型 */
submitAnswer = function(raw){
  const before = state.practice.messages ? state.practice.messages.length : 0;
  const r = _miaOrig.submitAnswer(raw);
  if(!state.practice.started) return r;

  const speak = t => { if(state.practice.autoSpeak!==false && t) miaSpeak(t); };

  // 判分 / 拦截 / 已完成 / 空输入 → 完全不干预
  if(!r || r.kind==='correct' || r.kind==='blocked' || r.kind==='completed' || r.kind==='empty'){
    if(r && r.kind==='correct'){
      const m = state.practice.messages[state.practice.messages.length-1];
      if(m && m.role==='mia') speak(m.text);
    }
    return r;
  }

  // classroom / off_topic → 用大模型改写这条回复
  const msgs = state.practice.messages;
  if(!msgs || msgs.length<=before) return r;
  const idx = msgs.length-1;
  const prev = msgs[idx];
  if(!prev || prev.role!=='mia') return r;

  const fallback = prev.text;
  msgs[idx] = {role:'mia', text:'Mia 正在想…', typing:true};
  commit(); miaScrollBottom();

  miaAskServer().then(reply=>{
    msgs[idx] = {role:'mia', text:String(reply), llm:true};
    commit(); miaScrollBottom(); speak(reply);
  }).catch(()=>{
    msgs[idx] = {role:'mia', text:fallback};
    commit(); miaScrollBottom(); speak(fallback);
  });
  return r;
};

function miaPcmToB64(int16){
  let bin=''; const u8 = new Uint8Array(int16.buffer);
  const CH = 0x8000;
  for(let i=0;i<u8.length;i+=CH){ bin += String.fromCharCode.apply(null, u8.subarray(i, i+CH)); }
  return btoa(bin);
}

}

/* 有些设备（iOS Safari / 部分安卓）忽略 sampleRate:16000，这里线性插值兜底 */
function miaResample16k(input, inRate){
  if(!inRate || inRate === 16000) return input;
  const ratio = inRate / 16000;
  const n = Math.floor(input.length / ratio);
  const out = new Float32Array(n);
  for(let i=0;i<n;i++){
    const pos = i * ratio;
    const i0 = pos | 0;
    const i1 = i0 + 1 < input.length ? i0 + 1 : i0;
    const t = pos - i0;
    out[i] = input[i0]*(1-t) + input[i1]*t;
  }
  return out;
}

function miaStartRec(){
  if(_recOn) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    tell('当前环境不支持麦克风，请用 https 网址在手机浏览器打开。'); return;
  }
  miaAsrReady(ok=>{
    if(!ok){ tell('语音识别服务尚未配置完成，先用文字和 Mia 聊吧。'); return; }
    navigator.mediaDevices.getUserMedia({audio:{channelCount:1, echoCancellation:true, noiseSuppression:true}})
      .then(stream=>{
        _recStream = stream; _recChunks = []; _recStartAt = Date.now();
        const AC = window.AudioContext || window.webkitAudioContext;
        _recCtx = new AC({sampleRate:16000});
        const src = _recCtx.createMediaStreamSource(stream);
        const node = _recCtx.createScriptProcessor(4096, 1, 1);
        node.onaudioprocess = ev=>{
          const f = ev.inputBuffer.getChannelData(0);
          const rs = miaResample16k(f, _recCtx.sampleRate);
          const i16 = new Int16Array(rs.length);
          for(let i=0;i<rs.length;i++){
            let v = Math.max(-1, Math.min(1, rs[i]));
            i16[i] = v < 0 ? v*0x8000 : v*0x7FFF;
          }
          _recChunks.push(i16);
        };
        src.connect(node); node.connect(_recCtx.destination);
        _recNode = node; _recOn = true; miaMicUI(true);
        tell('请说话，说完点「停止」。');
      })
      .catch(()=>tell('麦克风权限被拒绝，请在浏览器设置里允许。'));
  });
}

function miaFinishRec(){
  if(!_recOn) return;
  const secs = (Date.now()-_recStartAt)/1000;
  miaStopRec();
  if(secs < 0.5){ tell('录音太短，再说一次吧。'); return; }
  let total = 0; _recChunks.forEach(c=>total += c.length);
  const all = new Int16Array(total); let off = 0;
  _recChunks.forEach(c=>{ all.set(c, off); off += c.length; });
  if(total < 16000*0.4){ tell('录音太短，再说一次吧。'); return; }
  const b64 = miaPcmToB64(all);
  tell('正在识别…');
  fetch(MIA_ASR, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({pcm:b64})
  }).then(r=>r.json()).then(d=>{
    if(d && d.text){
      const inp = document.getElementById('answerInput');
      if(inp){ inp.value = d.text; state.practice.draft = d.text; }
      submitAnswer(d.text);
    }else{
      tell('没听清，再说一次？');
    }
  }).catch(()=>tell('语音识别失败，先用文字聊吧。'));
}

/* 注入麦克风按钮 */
function miaPatchMic(){
  if(state.tab!=='teacher') return;
  const box = document.querySelector('.mia-extra');
  if(!box || box.querySelector('#miaMicBtn')) return;
  const dis = state.practice.started ? '' : 'disabled';
  const btn = document.createElement('button');
  btn.id = 'miaMicBtn';
  btn.className = 'mia-chip mia-mic';
  btn.disabled = !state.practice.started;
  btn.textContent = '🎤 说话';
  btn.addEventListener('click', ()=>{ _recOn ? miaFinishRec() : miaStartRec(); });
  const rows = box.querySelector('.mia-rows');
  (rows || box).appendChild(btn);
}

const _miaV1Render = render;   /* v1 的 render（内含 miaPatchUI） */
render = function(){
  const r = _miaV1Render.apply(null, arguments);
  try{ miaPatchMic(); }catch(e){}
  return r;
};
miaPatchUI();
miaPatchMic();

if(!document.getElementById('miaMicStyle')){
  const st = document.createElement('style');
  st.id = 'miaMicStyle';
  st.textContent = '.mia-mic.rec{background:#e11d48!important;color:#fff!important;border-color:#e11d48!important}';
  document.head.appendChild(st);
}

window.__miaLLM = {miaAskServer, miaHistory, miaStartRec, miaFinishRec, MIA_API, MIA_ASR};


/* 初始化 */
if(state.practice.autoSpeak===undefined) state.practice.autoSpeak = true;
miaPatchUI();

/* 调试钩子（仅本机验收用，部署前可一键剔除） */
window.__qdDebug = {get state(){return state}, commit, render, submitAnswer, startPractice,
                    runDemo, reset, miaIntents, miaSpeak, analyze};

})();
